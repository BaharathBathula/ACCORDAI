version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: accordai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accordai
    ports:
      - "5432:5432"
    volumes:
      - accordai_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: accordai-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/accordai
      SECRET_KEY: accordai-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o-mini
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: accordai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  accordai_postgres_data:
