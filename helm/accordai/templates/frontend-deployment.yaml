apiVersion: apps/v1
kind: Deployment
metadata:
  name: accordai-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: accordai-frontend

  template:
    metadata:
      labels:
        app: accordai-frontend

    spec:
      containers:
        - name: frontend

          image: {{ .Values.frontend.image }}

          ports:
            - containerPort: {{ .Values.frontend.port }}
