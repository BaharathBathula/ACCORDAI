apiVersion: apps/v1
kind: Deployment
metadata:
  name: accordai-backend

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: accordai-backend

  template:
    metadata:
      labels:
        app: accordai-backend

    spec:
      containers:
        - name: backend

          image: {{ .Values.backend.image }}

          ports:
            - containerPort: {{ .Values.backend.port }}
